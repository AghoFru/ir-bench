[project]
name = "ir-bench"
version = "0.3.0"
description = "Dataset and engine independent retrieval evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["ir-measures>=0.4.3,<0.5", "ir-datasets>=0.6.3,<0.7"]

[project.optional-dependencies]
neural = ["sentence-transformers>=5.1,<6", "faiss-cpu>=1.12,<2", "scipy>=1.10,<2"]
terrier = ["pyterrier[java]>=1.1.2,<2"]

[project.scripts]
ir-bench = "ir_bench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ir_bench*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
