name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[terrier]' ruff==0.16.7 build
      - run: ruff check ir_bench tests examples
      - run: ruff format --check ir_bench tests examples
      - run: python -m unittest discover -s tests -v
        env:
          IR_BENCH_LIVE: '1'
      - run: python -m build --outdir work/dist
